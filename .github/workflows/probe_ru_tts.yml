name: Probe RU endpoints on runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Run endpoint probe
        run: |
          python - <<'EOF'
          import asyncio, json
          import edge_tts
          import edge_tts.constants, edge_tts.communicate
          print("edge_tts version:", edge_tts.__version__, flush=True)
          STOCK = edge_tts.constants.WSS_URL
          print("stock:", STOCK, flush=True)
          token = getattr(edge_tts.constants, "TRUSTED_CLIENT_TOKEN", "6A5AA1D4EAFF4E9FB37E23D68491D6F4")
          PATCHED = ("wss://api.msedgeservices.com/tts/cognitiveservices/websocket/v1"
                     f"?Ocp-Apim-Subscription-Key={token}")
          results = {}

          def use(url):
              edge_tts.constants.WSS_URL = url
              edge_tts.communicate.WSS_URL = url

          async def try_case(label, voice, text):
              try:
                  c = edge_tts.Communicate(text, voice, boundary="WordBoundary")
                  audio = bytearray()
                  bounds = 0
                  async with asyncio.timeout(40):
                      async for chunk in c.stream():
                          if chunk.get("type") == "audio":
                              audio.extend(chunk.get("data", b""))
                          elif chunk.get("type") == "WordBoundary":
                              bounds += 1
                  open(f"ep_{label}.mp3", "wb").write(bytes(audio))
                  results[label] = {"ok": True, "bytes": len(audio), "bounds": bounds}
                  print(f"{label}: OK bytes={len(audio)} bounds={bounds}", flush=True)
              except Exception as e:
                  results[label] = {"ok": False, "error": f"{type(e).__name__}: {str(e)[:160]}"}
                  print(f"{label}: FAIL {type(e).__name__} {str(e)[:160]}", flush=True)

          async def main():
              cyr = "Привет, я говорю по-русски. Сегодня мы обсуждаем путешествия."
              use(STOCK)
              await try_case("stock_dmitry", "ru-RU-DmitryNeural", cyr)
              await try_case("stock_dariya", "ru-RU-DariyaNeural", cyr)
              use(PATCHED)
              await try_case("patched_dmitry", "ru-RU-DmitryNeural", cyr)
              await try_case("patched_dariya", "ru-RU-DariyaNeural", cyr)
              await try_case("patched_svetlana", "ru-RU-SvetlanaNeural", cyr)

          asyncio.run(main())
          json.dump(results, open("probe_results.json", "w"), indent=1)
          print("RESULTS:", json.dumps(results), flush=True)
          EOF

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ru-endpoint-probe-${{ github.run_number }}
          path: |
            probe_results.json
            ep_*.mp3
          retention-days: 7
